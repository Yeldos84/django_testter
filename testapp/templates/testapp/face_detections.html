<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Распознавание лица</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    #video {
      width: 320px;
      height: 240px;
      border: 2px solid #333;
      border-radius: 10px;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
      font-size: 18px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Распознавание лица и проверка доступа</h1>
  <video id="video" autoplay></video>
  <br>
  <button id="captureBtn">Сделать снимок и отправить</button>
  <div id="status">Ожидание...</div>

  <script>
    const video = document.getElementById("video");
    const captureBtn = document.getElementById("captureBtn");
    const statusDiv = document.getElementById("status");

    // Запускаем камеру
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        video.srcObject = stream;
      })
      .catch(err => {
        statusDiv.textContent = "Ошибка доступа к камере.";
        console.error(err);
      });

    captureBtn.addEventListener("click", async () => {
      statusDiv.textContent = "Анализ лица...";

      // Захватываем кадр
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Преобразуем в blob (jpeg)
      canvas.toBlob(async (blob) => {
        const formData = new FormData();
        formData.append("face_image", blob, "face.jpg");

        try {
          const response = await fetch("http://localhost:8081/face_detections/", {
            method: "POST", // Убедись, что используешь POST
            body: formData
          });

          const data = await response.json();
          console.log(response);

          if (data.access) {
            statusDiv.textContent = "✅ " + data.message;
            setTimeout(() => {
              window.location.href = data.redirect_url;
            }, 2000);
          } else {
            statusDiv.textContent = "❌ " + data.message;
          }
        } catch (error) {
          console.error("Ошибка при отправке:", error);
          statusDiv.textContent = "Произошла ошибка при отправке данных.";
        }
      }, "image/jpeg");
    });
  </script>
</body>
</html>
